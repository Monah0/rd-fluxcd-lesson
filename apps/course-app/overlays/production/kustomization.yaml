apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base
  - dragonfly.yaml
  - hpa.yaml

patches:
  - target:
      kind: Deployment
      name: course-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

patchesStrategicMerge:
  - ingress-patch.yaml