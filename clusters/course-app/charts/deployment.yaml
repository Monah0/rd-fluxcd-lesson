apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "course-app.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "course-app.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "course-app.name" . }}

    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8080

          env:
            - name: APP_STORE
              value: {{ .Values.app.store | quote }}

            - name: APP_REDIS_URL
              value: "redis://dragonfly:6379/0"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080